spring:
  application:
    name: backend-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Configuração de Segurança de Tokens JWT
api:
  security:
    jwt:
      secret: ${JWT_SECRET:} # obrigatório, sem valor padrão (gere com: openssl rand -hex 32)
      expiration: ${JWT_EXPIRATION:86400} # 24 horas em segundos

# Configuração do Swagger OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Configuração de SSO Google
google:
  client-id: ${GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID_LOCAL:${GOOGLE_CLIENT_ID_PROD:739066979344-miehigs653hlllui1fvskbfv083o029f.apps.googleusercontent.com}}}
  client-secret: ${GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET_LOCAL:${GOOGLE_CLIENT_SECRET_PROD:}}}
  android-client-id: ${GOOGLE_ANDROID_CLIENT_ID:}
  ios-client-id: ${GOOGLE_IOS_CLIENT_ID:}

seniorinsight:
  integrations:
    llm:
      openai:
        base-url: ${LLM_OPENAI_BASE_URL:https://api.openai.com}
        api-key: ${LLM_OPENAI_API_KEY:}
      anthropic:
        base-url: ${LLM_ANTHROPIC_BASE_URL:https://api.anthropic.com}
        api-key: ${LLM_ANTHROPIC_API_KEY:}
      google:
        base-url: ${LLM_GOOGLE_BASE_URL:https://generativelanguage.googleapis.com}
        api-key: ${LLM_GOOGLE_API_KEY:}
    openwearables:
      enabled: ${OPENWEARABLES_ENABLED:false}
      base-url: ${OPENWEARABLES_BASE_URL:https://api.openwearables.io}
      api-key: ${OPENWEARABLES_API_KEY:}
      timeout-seconds: ${OPENWEARABLES_TIMEOUT_SECONDS:5}
