spring:
  application:
    name: backend-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    listener:
      simple:
        # Falhou depois das tentativas: não volta para a fila, vai para a care.dlq.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

  # Resource server: só valida o access token emitido pelo Keycloak (realm seniorinsight).
  # O JWKS é descoberto pelo issuer; para usar outro endereço (ex.: rede interna do Docker),
  # defina SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      # O healthcheck do Swarm chama /actuator/health. Com o RabbitMQ no health, uma queda do broker deixaria o
      # care-service DOWN e o Swarm o reiniciaria em loop, derrubando SOS e telemetria. A outbox já tolera o broker
      # fora do ar (o evento fica pendente), então ele não entra no health.
      enabled: false

# Configuração do Swagger OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

care:
  seguranca:
    # Role de realm do Keycloak que as rotas /internal/** exigem (conta de serviço dos outros serviços).
    papel-servico: ${CARE_PAPEL_SERVICO:servico-interno}
  exclusao:
    aviso-rede:
      # A cópia do aviso à rede (nome e e-mail dos membros) fica disponível por este prazo.
      retencao: P7D
      intervalo-limpeza: PT1H
  mensageria:
    # Routing keys da care.q na exchange si.events.
    eventos-consumidos: user.created,lgpd.erasure.requested
  outbox:
    relay:
      intervalo: PT1S
      tamanho-lote: 100
      timeout-confirmacao: PT5S

seniorinsight:
  idoso:
    dominio-email: ${KEYCLOAK_DOMINIO_EMAIL_IDOSO:idoso.seniorinsight.invalid}
  consentimento:
    versao-termo: ${CONSENTIMENTO_VERSAO_TERMO:v1}
  integrations:
    llm:
      openai:
        base-url: ${LLM_OPENAI_BASE_URL:https://api.openai.com}
        api-key: ${LLM_OPENAI_API_KEY:}
      anthropic:
        base-url: ${LLM_ANTHROPIC_BASE_URL:https://api.anthropic.com}
        api-key: ${LLM_ANTHROPIC_API_KEY:}
      google:
        base-url: ${LLM_GOOGLE_BASE_URL:https://generativelanguage.googleapis.com}
        api-key: ${LLM_GOOGLE_API_KEY:}
    openwearables:
      enabled: ${OPENWEARABLES_ENABLED:false}
      base-url: ${OPENWEARABLES_BASE_URL:https://api.openwearables.io}
      api-key: ${OPENWEARABLES_API_KEY:}
      timeout-seconds: ${OPENWEARABLES_TIMEOUT_SECONDS:5}
