spring:
  application:
    name: backend-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

seniorinsight:
  integrations:
    llm:
      openai:
        base-url: ${LLM_OPENAI_BASE_URL:https://api.openai.com}
        api-key: ${LLM_OPENAI_API_KEY:}
      anthropic:
        base-url: ${LLM_ANTHROPIC_BASE_URL:https://api.anthropic.com}
        api-key: ${LLM_ANTHROPIC_API_KEY:}
      google:
        base-url: ${LLM_GOOGLE_BASE_URL:https://generativelanguage.googleapis.com}
        api-key: ${LLM_GOOGLE_API_KEY:}
