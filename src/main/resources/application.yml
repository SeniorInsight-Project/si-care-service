spring:
  application:
    name: backend-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Configuração de Segurança de Tokens JWT
api:
  security:
    jwt:
      secret: ${JWT_SECRET:4f9d2b8e7c1a5f6e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e}
      expiration: ${JWT_EXPIRATION:86400} # 24 horas em segundos

# Configuração do Swagger OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

seniorinsight:
  integrations:
    llm:
      openai:
        base-url: ${LLM_OPENAI_BASE_URL:https://api.openai.com}
        api-key: ${LLM_OPENAI_API_KEY:}
      anthropic:
        base-url: ${LLM_ANTHROPIC_BASE_URL:https://api.anthropic.com}
        api-key: ${LLM_ANTHROPIC_API_KEY:}
      google:
        base-url: ${LLM_GOOGLE_BASE_URL:https://generativelanguage.googleapis.com}
        api-key: ${LLM_GOOGLE_API_KEY:}
