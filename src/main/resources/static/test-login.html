<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeniorInsight - Teste de Login Google SSO</title>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 520px;
            width: 100%;
            padding: 32px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #1a202c;
            margin-bottom: 8px;
        }
        p {
            color: #718096;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        .result-box {
            display: none;
            text-align: left;
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 13px;
            word-break: break-all;
        }
        .result-success {
            background-color: #ebfbee;
            border: 1px solid #c3f7cb;
            color: #1d7324;
        }
        .result-error {
            background-color: #fdf2f2;
            border: 1px solid #f9d2d2;
            color: #9b1c1c;
        }
        pre {
            background: #2d3748;
            color: #68d391;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 250px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>SeniorInsight - Teste SSO Google</h1>
    <p>Clique no botão oficial do Google abaixo para autenticar na sua aplicação local.</p>

    <!-- Configuração do Google Sign-In -->
    <div id="g_id_onload"
         data-client_id="739066979344-miehigs653hlllui1fvskbfv083o029f.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="btn-container">
        <div class="g_id_signin"
             data-type="standard"
             data-shape="rectangular"
             data-theme="outline"
             data-text="signin_with"
             data-size="large"
             data-logo_alignment="left">
        </div>
    </div>

    <div id="loading" style="display: none; color: #4a5568; font-size: 14px;">
        ⏳ Autenticando com o backend SeniorInsight...
    </div>

    <div id="result" class="result-box"></div>
</div>

<script>
    // Callback disparado pelo Google assim que o usuário faz login
    function handleCredentialResponse(response) {
        const idToken = response.credential;
        console.log("Google ID Token recebido!");

        document.getElementById('loading').style.display = 'block';
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'none';

        // Dispara requisição POST para o backend local do SeniorInsight
        fetch('/api/v1/auth/sso', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                provider: 'GOOGLE',
                idToken: idToken
            })
        })
        .then(async res => {
            const data = await res.json();
            document.getElementById('loading').style.display = 'none';
            resultDiv.style.display = 'block';

            if (res.ok) {
                resultDiv.className = 'result-box result-success';
                resultDiv.innerHTML = `
                    <strong>🎉 Login realizado com sucesso!</strong>
                    <p style="margin: 8px 0; color: #1d7324;">Conta provisionada no PostgreSQL via JIT e token JWT gerado pelo SeniorInsight:</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } else {
                resultDiv.className = 'result-box result-error';
                resultDiv.innerHTML = `
                    <strong>❌ Erro na autenticação (${res.status}):</strong>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            }
        })
        .catch(err => {
            document.getElementById('loading').style.display = 'none';
            resultDiv.style.display = 'block';
            resultDiv.className = 'result-box result-error';
            resultDiv.innerHTML = `<strong>❌ Erro de conexão:</strong><br>${err.message}`;
        });
    }
</script>

</body>
</html>
