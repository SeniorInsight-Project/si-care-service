spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seniorinsight}
    username: ${DB_USERNAME:seniorinsight}
    password: ${DB_PASSWORD:seniorinsight}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}


# Simulações de e-mail e de SOS com o conteúdo completo (dados pessoais): só no perfil dev.
logging:
  level:
    com.seniorinsight.backendcore.service.SimuladorEmailService: DEBUG
    com.seniorinsight.backendcore.listener.SosEventListener: DEBUG
