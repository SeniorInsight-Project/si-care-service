spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seniorinsight}
    username: ${DB_USERNAME:seniorinsight}
    password: ${DB_PASSWORD:seniorinsight}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Configuração direta das credenciais do Google para DEV/Local
google:
  client-id: ${GOOGLE_CLIENT_ID_LOCAL:}
  client-secret: ${GOOGLE_CLIENT_SECRET_LOCAL:}

# Mapeamento para Spring Security OAuth2 (se utilizado na aplicação)
spring.security:
  oauth2:
    client:
      registration:
        google:
          client-id: ${GOOGLE_CLIENT_ID_LOCAL:}
          client-secret: ${GOOGLE_CLIENT_SECRET_LOCAL:}
