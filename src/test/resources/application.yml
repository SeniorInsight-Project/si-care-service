spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  rabbitmq:
    username: guest
    password: guest
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
        # Os testes de unidade e de web não sobem broker; os de integração ligam o listener.
        auto-startup: false
  data:
    redis:
      repositories:
        enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Nunca é consultado: os testes injetam o JWT com SecurityMockMvcRequestPostProcessors.jwt().
          issuer-uri: http://localhost:8180/realms/seniorinsight

care:
  mensageria:
    eventos-consumidos: user.created,lgpd.erasure.requested
  outbox:
    relay:
      intervalo: PT1S
      tamanho-lote: 100
      timeout-confirmacao: PT5S
